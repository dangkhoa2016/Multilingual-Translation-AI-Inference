[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-translation-ai-inference"
version = "1.0.0"
authors = [{name = "Đăng Khoa", email = "i.am@dangkhoa.dev"}]
license = "MIT"
keywords = ["translation", "multilingual", "modal", "gpu", "postgresql"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
description = "Multilingual translation API with four independently scaling Modal L40S model workers and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4,<0.166",
    "pydantic>=2.14.3,<3",
    "SQLAlchemy>=2.0.40,<2.2",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
    "modal>=1.3.5,<2",
    "python-dotenv>=1.0,<2",
    "alembic>=1.17,<2",
]

[project.urls]
Homepage = "https://github.com/dangkhoa2016/Multilingual-Translation-AI-Inference"
Source = "https://github.com/dangkhoa2016/Multilingual-Translation-AI-Inference"
Documentation = "https://github.com/dangkhoa2016/Multilingual-Translation-AI-Inference/tree/main/docs"
Issues = "https://github.com/dangkhoa2016/Multilingual-Translation-AI-Inference/issues"

[project.optional-dependencies]
# FastAPI TestClient needs httpx, but production inference does not.
demo = ["httpx>=0.28,<0.29"]
dev = ["pytest>=9,<10", "httpx>=0.28,<0.29", "ruff>=0.14,<1", "nbconvert>=7.16,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
