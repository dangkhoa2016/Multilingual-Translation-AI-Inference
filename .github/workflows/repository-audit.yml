name: Public Repository Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check bilingual documentation, licenses, provenance and links
        run: python scripts/audit_public_repository.py
